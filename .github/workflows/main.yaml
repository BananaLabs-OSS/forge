name: Main Checks

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

permissions: {}

jobs:
  test-node:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [6.x, 8.x, 10.x, 12.x, 14.x, 16.x, 18.x, 20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    # FIXME: Install/build with 16.x until webpack is updated
    - name: Use Node.js 16.x
      uses: actions/setup-node@v6
      with:
        node-version: 16.x
    - run: npm install
    # FIXME: Run tests with target version until webpack is updated
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Run test with Node.js ${{ matrix.node-version }}
      run: npm run test-node
  test-karma:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [16.x]
        bundler: [webpack, browserify]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Run karma tests
      run: npm run test-karma
      env:
        BUNDLER: ${{ matrix.bundler }}
#  lint:
#    runs-on: ubuntu-latest
#    timeout-minutes: 10
#    strategy:
#      matrix:
#        node-version: [16.x]
#    steps:
#    - uses: actions/checkout@v5
#      with:
#        persist-credentials: false
#    - name: Use Node.js ${{ matrix.node-version }}
#      uses: actions/setup-node@v6
#      with:
#        node-version: ${{ matrix.node-version }}
#    - run: npm install
#    - name: Run eslint
#      run: npm run lint
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [16.x]
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Generate coverage report
      run: npm run coverage-ci
    - name: Verify coverage report
      run: test -s ./coverage/lcov.info
